
<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>商家管理與POS系統</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
:root{--bg:#f2f3ef;--surface:#ffffff;--soft:#eaece6;--ink:#1d2420;--muted:#626d65;--line:#dadfd6;--accent:#c4332a;--accent-ink:#ffffff;--ok:#1d7648;--warn:#92610a;--bad:#b42318;--brand-orange:#f39c12;--f-body:'Noto Sans TC',sans-serif;--f-disp:'Noto Serif TC',serif;}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;padding-block:0 96px;margin:0}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px;}
button,input,select,textarea{font:inherit;color:inherit;outline:none;}
h1,h2,h3,p{margin:0}
.muted{color:var(--muted)}
.top{display:grid;grid-template-columns:1fr auto;gap:10px 16px;align-items:center;padding:14px 16px 0}
.brand{display:flex;align-items:center;gap:12px;}
.mark{display:grid;place-items:center;width:42px;height:42px;border-radius:10px;background:var(--accent);color:var(--accent-ink);font:700 22px var(--f-disp);}
.top-r{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.tabs{grid-column:1/-1;display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);padding-bottom:0}
.tab{border:0;background:none;padding:10px 14px;font-weight:500;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;}
.tab.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:700}
main{padding-top:18px;display:grid;gap:16px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 16px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:0.2s;}
.btn:hover{background:var(--soft)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.sm{padding:4px 10px;min-height:32px;font-size:13px;}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.inp{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:8px 10px;}
label.f{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.sp{justify-content:space-between}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
table{border-collapse:collapse;width:100%;font-size:14px;}
th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
th{color:var(--muted);font-weight:500;white-space:nowrap;}
.num{text-align:right;font-variant-numeric:tabular-nums}
.modal{position:fixed;inset:0;z-index:50;background:#0008;display:grid;place-items:center;padding:16px}
.mp{background:var(--surface);border-radius:12px;padding:20px;width:min(500px,100%);max-height:90vh;overflow:auto;display:grid;gap:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;}
.subtabs{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 16px;cursor:pointer;white-space:nowrap;font-weight:500;}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.stat-box{background:#f8f9fa;border:1px solid var(--line);padding:16px;border-radius:8px;}
.stat-box small{display:block;color:var(--muted);margin-bottom:4px;}
.stat-box b{font-size:24px;font-family:var(--f-disp);}
.dynamic-row{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:center;margin-bottom:8px;}
.perm-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;background:#f8f9fa;padding:12px;border-radius:8px;}
.pill{display:inline-flex;align-items:center;border-radius:99px;padding:2px 10px;font-size:12px;font-weight:700;background:var(--soft);color:var(--muted);white-space:nowrap}
.pill.ok{background:#dff1e6;color:var(--ok)}
.pill.warn{background:#fbefd2;color:var(--warn)}
.pill.bad{background:#fde4e1;color:var(--bad)}
.pill.info{background:#e1eafa;color:var(--info)}
.ocards{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.oc{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:8px;align-content:start}
.oc .no{font:700 20px var(--f-disp)}
.olines{display:grid;gap:2px;font-size:14px}
.kan{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;align-items:start}
.kcol{background:var(--soft);border-radius:14px;padding:10px;display:grid;gap:10px;align-content:start}
.kcol h2{font-size:15px;display:flex;justify-content:space-between}
.tbls{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.tbl{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:8px;align-content:start}
.tbl.dining{border-color:var(--accent)}
.tbl.dirty{border-color:var(--warn)}
.tbl .n{font:700 26px var(--f-disp)}
.menu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.item{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.item-img{width:64px;height:64px;border-radius:12px;background-size:cover;background-position:center;background-color:var(--soft);flex:none}
.mono{width:64px;height:64px;border-radius:12px;display:grid;place-items:center;font-weight:bold;font-size:26px;background:var(--soft);color:var(--ink);flex:none}
.cartbar{display:none;} .scrim{display:none;}
.cart{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:14px}
.order-layout{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:20px;align-items:start}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.qty button{border:0;background:var(--soft);width:34px;height:34px;cursor:pointer;font-size:18px}
.qty span{min-width:30px;text-align:center;font-variant-numeric:tabular-nums}
.sum{display:grid;gap:4px;font-variant-numeric:tabular-nums}
.sum div{display:flex;justify-content:space-between}
.sum .tot{font-size:18px;font-weight:700;border-top:1px solid var(--line);padding-top:8px;margin-top:4px}
.cline{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding-bottom:10px;border-bottom:1px dashed var(--line)}
/* 顧客線上點餐樣式 */
.cus-wrap { max-width: 480px; margin: 0 auto; background: var(--surface); min-height: 100vh; box-shadow: 0 0 20px rgba(0,0,0,0.05); }
.cus-head { padding: 20px; border-bottom: 1px solid var(--line); }
@media print{.wrap,.toast,.modal,.scrim,.top-r{display:none!important}body{background:white;padding:0;margin:0}#print-zone{display:block!important; color:#000; font-family:'Courier New', monospace; font-size:14px;}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast" hidden></div>
<div id="print-zone" style="display:none;"></div>

<script>
window.onerror = function(msg, url, line) {
  document.body.innerHTML = '<div style="position:fixed;inset:0;background:#fde4e1;z-index:9999;padding:30px;color:#b42318;font-family:sans-serif;"><h2 style="margin-top:0">⚠️ 系統載入失敗</h2><p>' + msg + '</p><button onclick="localStorage.clear();location.reload();" class="btn danger">點此重置暫存</button></div>';
};

const LS_REGISTRY = 'pos-registry', LS_CURRENT = 'pos-current-pin';
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => '$' + Math.round(n).toLocaleString('en-US');
const hm = t => new Date(t).toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit', hour12: false });
const mins = t => Math.max(0, Math.floor((Date.now() - t) / 60000));

// 補回遺失的常數定義
const ST = { pending: '待確認', making: '製作中', ready: '待取餐', done: '已完成', cancelled: '已取消' };
const TY = { dine: '內用', take: '外帶', deliv: '外送' };
const PAYS = { unpaid: '未付款', paid: '已付款', refunded: '已退款' };
const PM = { cash: '現金', mobile: '行動支付', card: '信用卡', later: '稍後付款' };
const ROLE = { admin: '店長', staff: '店員', kitchen: '廚房' };

let registry = {}; try { registry = JSON.parse(localStorage.getItem(LS_REGISTRY)) || {}; } catch(e) {}
if (Object.keys(registry).length === 0) registry['1234'] = '巷口食堂 (總店)';
let currentPin = localStorage.getItem(LS_CURRENT) || Object.keys(registry)[0];
let S = null; let isSysAdmin = false; const MASTER_PIN = '0000';

function seed(storeName) {
  return {
    storeName: storeName || '巷口食堂', 
    groups: { size: { label: '尺寸', req: true, multi: false, ch: [['中杯', 0], ['大杯', 10]] } }, 
    menu: [ { id: 'm1', cat: '主食', name: '滷肉飯', price: 90, desc: '招牌滷肉飯', opts: [], out: false }, { id: 'm2', cat: '飲品', name: '古早味紅茶', price: 30, desc: '', opts: ['size'], out: false } ], 
    orders: [], tables: {}, nextNo: 104,
    settings: { open: true, hours: '10:30 – 21:00', managerPin: '8888', autoAcceptO2O: false, tables: 8, printSize: '80mm', address: '新北市蘆洲區得勝街80號', phone: '0988814805' },
    staff: [{ name: '店長', role: 'admin', perms:['all'] }, { name: '店員', role: 'staff', perms:['checkout'] }],
    log: []
  };
}

function loadStore(pin) {
  try { const r = localStorage.getItem('pos-data-' + pin); if (r) return JSON.parse(r); } catch(e) {} 
  return seed(registry[pin]);
}

S = loadStore(currentPin);
const ui = { 
  locked: true, tab: 'counter', atab: 'report', inputPin: '', 
  cart: [], co: { type: 'take', table: '1', name: '', phone: '', pay: 'cash', note: '' }, cartOpen: false, cview: 'list', ofilter: 'all', oq: '',
  editMenu: null, editGroup: null, cusLoginPhone: '', modal: null 
};

const cur = () => S.staff[ui.op] || S.staff[0];
const can = p => cur().role === 'admin' || (cur().perms && cur().perms.includes(p));

function saveStore() { localStorage.setItem('pos-data-' + currentPin, JSON.stringify(S)); }
let toastT = null;
function toast(msg) { 
  const t = $('#toast'); if(!t) return;
  t.textContent = msg; t.hidden = false; 
  clearTimeout(toastT); 
  toastT = setTimeout(() => { const tt = $('#toast'); if(tt) tt.hidden = true; }, 2600); 
}
function logit(msg) { S.log.unshift({ t: Date.now(), who: cur().name, msg }); S.log = S.log.slice(0, 80); }

/* ================= 核心計算 ================= */
function unitOf(item, sel) {
  let p = item.price; 
  Object.keys(sel || {}).forEach(g => { if (S.groups[g]) { (sel[g] || []).forEach(n => { const c = S.groups[g].ch.find(x => x[0] === n); if (c) p += c[1]; }); } }); 
  return p;
}
function calc() {
  const sub = ui.cart.reduce((a, l) => a + l.unit * l.qty, 0); 
  return { sub, total: sub };
}
function lineDesc(l) { const a = []; Object.keys(l.sel || {}).forEach(g => { (l.sel[g] || []).forEach(n => a.push(n)); }); return a.join('・'); }

/* ================= 畫布主體 ================= */
function shell() {
  if (ui.locked) {
    return `<div style="display:grid;place-items:center;min-height:80vh;"><div class="card" style="text-align:center;width:min(320px,100%)">
      <h2>🔒 系統登入</h2><p class="muted">密碼 1234 (系統管理 0000)</p>
      <input type="password" id="login-pin" class="inp" style="text-align:center;font-size:24px;margin:12px 0;" placeholder="請輸入密碼">
      <button class="btn pri" style="width:100%" data-act="submitPin">進入系統</button></div></div>`;
  }
  if (isSysAdmin) return `<header class="top"><div class="brand"><span class="mark">系</span><div><b>系統管理員</b></div></div><div class="top-r"><button class="btn sm danger" data-act="lockAdmin">登出</button></div></header><main><div class="wrap">${vSysAdmin()}</div></main>`;
  if (ui.tab === 'customer') return vCustomer() + modalHtml();

  const pend = S.orders.filter(o => o.status === 'pending').length;
  const tabs = [['counter', '櫃台接單'], ['kitchen', '出餐看板'], ['tables', '桌位管理'], ['admin', '後台管理']];
  
  let body = '';
  if (ui.tab === 'counter') body = vCounter();
  else if (ui.tab === 'kitchen') body = vKitchen();
  else if (ui.tab === 'tables') body = vTables();
  else body = vAdmin();

  return `<div class="wrap"><header class="top"><div class="brand"><span class="mark">商</span><div><b>${esc(S.storeName)} · 商家後台</b></div></div>
    <div class="top-r">
      <button class="btn sm" data-act="openCustomerView" style="background:var(--brand-orange);color:#fff;border:none;">📱 線上點餐</button>
      <label class="op">角色：<select data-act="requestRoleChange">${S.staff.map((s, i) => `<option value="${i}" ${i === ui.op ? 'selected' : ''}>${esc(s.name)} (${ROLE[s.role]||s.role})</option>`).join('')}</select></label>
      <button class="btn sm danger" data-act="lockAdmin">鎖定登出</button>
    </div>
    <nav class="tabs">${tabs.map(t => `<button class="tab ${ui.tab === t[0] ? 'on' : ''}" data-act="mtab" data-v="${t[0]}">${t[1]}${t[0] === 'kitchen' && pend ? `<span class="badge">${pend}</span>` : ''}</button>`).join('')}</nav></header>
    <main>${body}</main></div>${modalHtml()}`;
}

/* ================= 1. 櫃台接單 ================= */
function vCounter() {
  if (ui.cview === 'new') return ordering();
  const f = ui.ofilter, q = ui.oq.trim();
  let list = S.orders.slice().sort((a, b) => b.t - a.t).filter(o => {
    if (f === 'active' && !['pending', 'making', 'ready'].includes(o.status)) return false; 
    if (f === 'unpaid' && o.pay.s === 'paid') return false;
    if (f === 'done' && o.status !== 'done') return false; 
    if (f === 'cancelled' && o.status !== 'cancelled') return false;
    if (q && !(String(o.no).includes(q) || String(o.table) === q || o.name.includes(q))) return false; 
    return true;
  });
  const fl = [['all', '全部'], ['active', '進行中'], ['unpaid', '待付款'], ['done', '已完成'], ['cancelled', '已取消']];
  return `<div class="row sp"><div class="row grow"><button class="btn pri" data-act="cnew">＋ 櫃台點餐／現場下單</button><input id="oq" class="inp" style="max-width:320px" type="search" placeholder="搜尋單號、桌號..." value="${esc(ui.oq)}" data-bind="oq"></div></div>
    <div class="chips">${fl.map(x => `<button class="chip ${f === x[0] ? 'on' : ''}" data-act="ofilter" data-v="${x[0]}">${x[1]}</button>`).join('')}</div>
    ${list.length ? `<div class="ocards">${list.map(orderCard).join('')}</div>` : `<div class="empty-state">目前無符合條件的訂單</div>`}`;
}

function ordering() {
  const c = calc();
  return `<div class="order-layout"><section><div class="toolbar"><input class="inp" type="search" placeholder="搜尋菜單品項..."></div>
    <div class="menu-grid">${S.menu.map(m => `<article class="item ${m.out ? 'out' : ''}">${m.img ? `<div class="item-img" style="background-image:url('${m.img}')"></div>` : `<div class="mono">${esc(m.name[0])}</div>`}<div><h3>${esc(m.name)}</h3><div class="ib"><b>${money(m.price)}</b>${m.opts.length ? '<small>可客製</small>' : ''}</div></div><button class="btn pri" data-act="add" data-id="${m.id}" ${m.out ? 'disabled' : ''}>${m.out ? '售完' : m.opts.length ? '選擇' : '加入'}</button></article>`).join('')}</div></section>
    <aside class="cart"><div class="cart-head"><h2>購物車</h2><button class="btn sm" data-act="cback">返回列表</button></div>
    ${ui.cart.map((l, i) => `<div class="cline"><b>${esc(l.name)}</b><span class="num">${money(l.unit * l.qty)}</span>${lineDesc(l) || l.note ? `<small style="grid-column:1/-1;">${esc(lineDesc(l))}${l.note ? ' / ' + esc(l.note) : ''}</small>` : ''}
    <div class="qty" style="grid-column:1/-1;"><button data-act="cqty" data-i="${i}" data-d="-1">−</button><span>${l.qty}</span><button data-act="cqty" data-i="${i}" data-d="1">+</button><button class="btn sm" data-act="crm" data-i="${i}" style="margin-left:auto;">移除</button></div></div>`).join('')}
    ${ui.cart.length ? `<div style="border-top:1px solid var(--line);padding-top:12px;">
      <select id="co-type" class="inp" data-bind="co.type"><option value="take" ${ui.co.type==='take'?'selected':''}>外帶</option><option value="dine" ${ui.co.type==='dine'?'selected':''}>內用</option></select>
      ${ui.co.type==='dine'?`<label class="f">桌號<select id="co-table" class="inp" data-bind="co.table">${Array.from({length:S.settings.tables},(_,i)=>`<option value="${i+1}" ${String(ui.co.table)===String(i+1)?'selected':''}>${i+1}桌</option>`).join('')}</select></label>`:''}
      <label class="f">付款方式<select id="co-pay" class="inp" data-bind="co.pay"><option value="cash">現金</option><option value="mobile">行動支付</option><option value="later">稍後付款</option></select></label>
      <div class="sum"><div><span>小計</span><span>${money(c.sub)}</span></div><div class="tot"><span>合計</span><span>${money(c.total)}</span></div></div>
      <button class="btn pri" style="width:100%;height:46px;" data-act="placeCounter">建立訂單</button>
    </div>` : '<div class="muted" style="text-align:center;padding:20px;">購物車為空</div>'}</aside></div>`;
}

function orderCard(o) {
  const payPill = `<span class="pill ${o.pay.s === 'paid' ? 'ok' : o.pay.s === 'refunded' ? 'info' : 'warn'}">${PAYS[o.pay.s]}</span>`;
  const stPill = `<span class="pill ${o.status === 'cancelled' ? 'bad' : o.status === 'done' ? 'ok' : o.status === 'pending' ? 'warn' : 'info'}">${ST[o.status]}</span>`;
  const typeLabel = TY[o.type] + (o.type === 'dine' ? ' · ' + o.table + ' 號桌' : '');
  const linesHtml = `<div class="olines">${o.lines.map(l => `<div><b>${esc(l.name)}</b> × ${l.qty}${lineDesc(l) ? `<br><small>${esc(lineDesc(l))}</small>` : ''}</div>`).join('')}</div>`;
  const open = !['done', 'cancelled'].includes(o.status);

  return `<article class="oc"><div class="row sp"><span class="no">#${o.no}</span><div class="row">${stPill}${payPill}</div></div>
    <div class="muted">${typeLabel} · ${hm(o.t)}</div>
    ${linesHtml}<div class="row sp"><b>總計 ${money(o.total)}</b></div>
    <div class="row">
      ${open ? `<button class="btn pri sm" data-act="adv" data-no="${o.no}">${o.status === 'pending' ? '接單製作' : '完成製作'}</button>` : ''}
      <button class="btn sm" data-act="printopen" data-no="${o.no}">列印單據</button>
      ${o.pay.s === 'unpaid' && open ? `<button class="btn sm" data-act="payopen" data-no="${o.no}">結帳</button>` : ''}
      ${open ? `<button class="btn sm danger" data-act="ask" data-no="${o.no}">取消</button>` : ''}
    </div></article>`;
}

/* ================= 2. 出餐看板與桌位管理 ================= */
function vKitchen() {
  const by = s => S.orders.filter(o => o.status === s).sort((a, b) => a.t - b.t);
  const kCard = o => `<article class="oc"><div class="row sp"><span class="no">#${o.no}</span><span class="pill">${mins(o.t)} 分鐘</span></div>
    <div><b>${TY[o.type]}${o.type==='dine'?' · '+o.table+'桌':''}</b></div><div class="olines">${o.lines.map(l=>`<div>${esc(l.name)} x${l.qty}</div>`).join('')}</div>
    ${o.status!=='done'?`<button class="btn pri" style="min-height:44px;" data-act="adv" data-no="${o.no}">${o.status==='pending'?'接單製作':'完成製作'}</button>`:''}</article>`;
  return `<div class="kan">
    <section class="kcol"><h2><span>待確認新單</span></h2>${by('pending').map(kCard).join('')||'<p class="muted">無</p>'}</section>
    <section class="kcol"><h2><span>製作中</span></h2>${by('making').map(kCard).join('')||'<p class="muted">無</p>'}</section>
    <section class="kcol"><h2><span>待取餐</span></h2>${by('ready').map(kCard).join('')||'<p class="muted">無</p>'}</section>
  </div>`;
}

function vTables() {
  let h = `<div class="row sp" style="margin-bottom:12px"><p class="muted">桌位圖動態管理</p><div class="row"><button class="btn sm" data-act="tableDec">− 減少</button><b>${S.settings.tables} 桌</b><button class="btn sm pri" data-act="tableInc">＋ 新增</button></div></div><div class="tbls">`;
  for (let i = 1; i <= S.settings.tables; i++) {
    const os = S.orders.filter(o => o.type === 'dine' && String(o.table) === String(i) && !o.closed && o.status !== 'cancelled');
    const st = os.length ? 'dining' : (S.tables[i] || 'free');
    const due = os.filter(o => o.pay.s === 'unpaid').reduce((a, o) => a + o.total, 0);
    h += `<article class="tbl ${st}"><div class="row sp"><span class="n">${i}桌</span><span class="pill ${st === 'dining' ? 'bad' : st === 'dirty' ? 'warn' : 'ok'}">${st === 'dining' ? '用餐中' : st === 'dirty' ? '待清理' : '空桌'}</span></div>`;
    if (st === 'dining') h += `<div class="hint">${os.map(o=>`#${o.no}`).join('、')}</div><div class="row"><button class="btn sm" data-act="addto" data-t="${i}">加點</button></div><button class="btn pri sm" data-act="leave" data-t="${i}">${due ? '收款 ' + money(due) + ' 離席' : '清空桌位'}</button>`;
    else if (st === 'dirty') h += `<button class="btn pri sm" data-act="clean" data-t="${i}">清潔完成</button>`;
    else h += `<button class="btn sm" data-act="seat" data-t="${i}">安排入座</button>`;
    h += `</article>`;
  } 
  return h + `</div>`;
}

  window.myPieChart = new Chart(ctx, { type: 'pie', data: { labels: Object.keys(counts).length ? Object.keys(counts) : ['無數據'], datasets: [{ data: Object.values(counts).length ? Object.values(counts) : [1], backgroundColor: ['#f39c12', '#e74c3c', '#3498db'] }] }, options: { responsive: true, maintainAspectRatio: false } });

window.checkDynamicRow = function() {
  const rows = document.querySelectorAll('.eg-cname'); const lastRow = rows[rows.length - 1];

};

/* ================= 動作與事件 ================= */
const H = {
  submitPin: () => {
    const p = $('#login-pin') ? $('#login-pin').value.trim() : '';
    if (p === MASTER_PIN) { ui.locked = false; isSysAdmin = true; toast('系統管理員登入'); return; }
    if (p === '1234' && !registry['1234']) { registry['1234'] = '巷口食堂 (總店)'; localStorage.setItem(LS_REGISTRY, JSON.stringify(registry)); }
    if (registry[p]) { currentPin = p; S = loadStore(currentPin); ui.locked = false; isSysAdmin = false; toast('登入成功'); }
    else toast('密碼錯誤，測試請輸入 1234');
  },
  lockAdmin: () => { ui.locked = true; isSysAdmin = false; toast('已登出'); },
  atab: el => { ui.atab = el.dataset.v; }, mclose: () => { ui.modal = null; },
  mtab: el => { ui.tab = el.dataset.v; }, openCustomerView: () => { ui.tab = 'customer'; }, exitCustomerView: () => { ui.tab = 'counter'; },
  
  sysLoginStore: el => { currentPin = el.dataset.pin; S = loadStore(currentPin); isSysAdmin = false; saveStore(); toast('切換成功'); },
  
  addStaff: () => {
    const name = $('#ns-name').value.trim(); const role = $('#ns-role').value;
    if(!name) return toast('請輸入姓名');
    const perms = Array.from(document.querySelectorAll('.ns-perm:checked')).map(cb => cb.value);
    S.staff.push({ name, role, perms: role==='admin'?['all']:perms }); saveStore(); toast('建立成功'); $('#ns-name').value = '';
  },
  delStaff: el => { S.staff.splice(Number(el.dataset.i), 1); saveStore(); toast('已刪除'); },

  openGroupEdit: el => {
    const id = el.dataset.id; if(id) ui.editGroup = { id, ...S.groups[id] }; else ui.editGroup = { id: '', label: '', req: false, multi: false, ch: [] };
    ui.modal = { type: 'editGroup' };
  },
  saveGroup: () => {
    const label = $('#eg-name').value.trim(); if(!label) return toast('請填寫規格名稱');
    const ch = []; document.querySelectorAll('.dynamic-row').forEach(row => {
      const name = row.querySelector('.eg-cname').value.trim(); const price = Number(row.querySelector('.eg-cprice').value) || 0;
      if(name) ch.push([name, price]);
    });
    if(!ch.length) return toast('請至少填寫一個選項');
    const id = ui.editGroup.id || 'g_' + Date.now();
    S.groups[id] = { label, req: $('#eg-req').value==='true', multi: $('#eg-multi').value==='true', ch };
    saveStore(); ui.modal = null; toast('規格已儲存');
  },
  openMenuEdit: el => {
    const id = el.dataset.id; if(id) ui.editMenu = { ...S.menu.find(m=>m.id===id) }; else ui.editMenu = { id: '', name: '', cat: '主食', price: 0, desc: '', opts: [] };
    ui.modal = { type: 'editMenu' };
  },
  saveMenu: () => {
    const name = $('#em-name').value.trim(); if(!name) return toast('請填寫品名');
    const opts = Array.from(document.querySelectorAll('.em-opt')).filter(x=>x.parentElement.classList.contains('on')).map(x=>x.value);
    const mData = { id: ui.editMenu.id || 'm'+Date.now(), name, cat: '主食', price: Number($('#em-price').value)||0, opts, out: false, img: '' };
    if(ui.editMenu.id) { const idx = S.menu.findIndex(x=>x.id===mData.id); S.menu[idx] = mData; } else S.menu.push(mData);
    saveStore(); ui.modal = null; toast('菜單已更新');
  },

  // POS 接單邏輯
  cnew: () => { ui.cview = 'new'; }, cback: () => { ui.cview = 'list'; ui.cartOpen = false; }, ofilter: el => { ui.ofilter = el.dataset.v; },
  add: el => {
    const it = S.menu.find(m => m.id === el.dataset.id); if (!it || it.out) return;
    if (!it.opts.length) { ui.cart.push({ id: it.id, name: it.name, sel: {}, qty: 1, note: '', unit: it.price }); toast('已加入 ' + it.name); return; }
    const sel = {}; it.opts.forEach(g => { const G = S.groups[g]; if (G && G.req && G.ch.length) sel[g] = [G.ch[0][0]]; });
    ui.modal = { type: 'item', id: it.id, sel, qty: 1, note: '' };
  },
  optpick: el => {
    const m = ui.modal, g = el.dataset.g, c = el.dataset.c, G = S.groups[g];
    if (G.multi) { const a = m.sel[g] || []; m.sel[g] = a.includes(c) ? a.filter(x => x !== c) : a.concat(c); } else m.sel[g] = [c];
  },
  mqty: el => { ui.modal.qty = Math.max(1, ui.modal.qty + Number(el.dataset.d)); },
  madd: () => {
    const m = ui.modal, it = S.menu.find(x => x.id === m.id), note = $('#m-note') ? $('#m-note').value.trim() : '';
    ui.cart.push({ id: it.id, name: it.name, sel: JSON.parse(JSON.stringify(m.sel)), qty: m.qty, note: note, unit: unitOf(it, m.sel) });
    ui.modal = null; toast('已加入 ' + it.name);
  },
  cartopen: () => { ui.cartOpen = true; }, cartclose: () => { ui.cartOpen = false; },
  cqty: el => { const l = ui.cart[Number(el.dataset.i)]; l.qty += Number(el.dataset.d); if (l.qty <= 0) ui.cart.splice(Number(el.dataset.i), 1); },
  crm: el => { ui.cart.splice(Number(el.dataset.i), 1); }, settype: el => { ui.co.type = el.dataset.v; },
  placeCounter: () => {
    if (!ui.cart.length) return toast('購物車為空');
    const c = calc();
    const o = { no: S.nextNo++, type: ui.co.type, table: ui.co.type === 'dine' ? String($('#co-table').value) : '', name: '', phone: '', lines: JSON.parse(JSON.stringify(ui.cart)), sub: c.sub, total: c.total, status: 'making', pay: { s: 'unpaid', m: 'cash' }, t: Date.now(), note: '', src: 'counter', closed: false };
    S.orders.push(o); if (o.type === 'dine') S.tables[o.table] = 'dining';
    logit('建立訂單 #' + o.no); saveStore(); ui.cart = []; ui.cartOpen = false; ui.cview = 'list'; toast('成功建立訂單 #' + o.no);
  },
  adv: el => { const o = S.orders.find(x => x.no === Number(el.dataset.no)); if (!o) return; const next = { pending: 'making', making: 'ready', ready: 'done' }[o.status]; if (next) { o.status = next; saveStore(); } },
  payopen: el => { const o = S.orders.find(x => x.no === Number(el.dataset.no)); o.pay = { s: 'paid', m: 'cash' }; saveStore(); toast('結帳完成'); },
  ask: el => { const o = S.orders.find(x => x.no === Number(el.dataset.no)); o.status = 'cancelled'; saveStore(); toast('訂單已取消'); },
  tableInc: () => { S.settings.tables++; saveStore(); }, tableDec: () => { if (S.settings.tables > 1) { S.settings.tables--; saveStore(); } },
  seat: el => { S.tables[el.dataset.t] = 'dining'; saveStore(); }, addto: el => { ui.co.type = 'dine'; ui.co.table = el.dataset.t; ui.co.pay = 'later'; ui.cview = 'new'; ui.tab = 'counter'; },
  leave: el => { const t = el.dataset.t; S.orders.filter(o => o.type === 'dine' && String(o.table) === String(t) && !o.closed).forEach(o => { if (o.pay.s === 'unpaid') o.pay.s = 'paid'; o.closed = true; }); S.tables[t] = 'dirty'; saveStore(); },
  clean: el => { S.tables[el.dataset.t] = 'free'; saveStore(); },
  printopen: el => { ui.modal = { type: 'print', no: Number(el.dataset.no) }; },
  doprint: () => { window.print(); ui.modal = null; }
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  if (el.classList.contains('modal') && e.target.closest('[data-stop]')) return;
  if (H[el.dataset.act]) { H[el.dataset.act](el); render(); }
});

const val = t => t.type === 'checkbox' ? t.checked : t.value;
document.addEventListener('input', e => { 
  if (e.target.dataset.bind) { 
    const parts = e.target.dataset.bind.split('.'); let root = window;
    if (parts[0] === 'ui') { root = ui; parts.shift(); } else if (parts[0] === 'S') { root = S; parts.shift(); }
    parts.slice(0,-1).forEach(p=>{if(!root[p]) root[p]={}; root=root[p]}); 
    root[parts[parts.length-1]] = val(e.target);
  }
});
document.addEventListener('change', e => { if (e.target.dataset.save !== undefined) saveStore(); });

function render() {
  const sy = window.scrollY; $('#app').innerHTML = shell(); window.scrollTo(0, sy);
}
render();
</script>
