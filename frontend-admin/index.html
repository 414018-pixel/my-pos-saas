<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>商家管理後台</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
:root{--bg:#f2f3ef;--surface:#ffffff;--soft:#eaece6;--ink:#1d2420;--muted:#626d65;--line:#dadfd6;--accent:#c4332a;--accent-ink:#ffffff;--ok:#1d7648;--warn:#92610a;--bad:#b42318;--brand-orange:#f39c12;--f-body:'Noto Sans TC',sans-serif;--f-disp:'Noto Serif TC',serif;}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;padding-block:0 96px;margin:0}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px;}
button,input,select,textarea{font:inherit;color:inherit;outline:none;}
h1,h2,h3,p{margin:0}
.muted{color:var(--muted)}
.top{display:grid;grid-template-columns:1fr auto;gap:10px 16px;align-items:center;padding:14px 16px 0}
.brand{display:flex;align-items:center;gap:12px;}
.mark{display:grid;place-items:center;width:42px;height:42px;border-radius:10px;background:var(--accent);color:var(--accent-ink);font:700 22px var(--f-disp);}
.top-r{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.tabs{grid-column:1/-1;display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);padding-bottom:0}
.tab{border:0;background:none;padding:10px 14px;font-weight:500;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;}
.tab.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:700}
main{padding-top:18px;display:grid;gap:16px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 16px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:0.2s;}
.btn:hover{background:var(--soft)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.sm{padding:4px 10px;min-height:32px;font-size:13px;}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.inp{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:8px 10px;}
label.f{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.sp{justify-content:space-between}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
table{border-collapse:collapse;width:100%;font-size:14px;}
th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
th{color:var(--muted);font-weight:500;white-space:nowrap;}
.num{text-align:right;font-variant-numeric:tabular-nums}
.modal{position:fixed;inset:0;z-index:50;background:#0008;display:grid;place-items:center;padding:16px}
.mp{background:var(--surface);border-radius:12px;padding:20px;width:min(500px,100%);max-height:90vh;overflow:auto;display:grid;gap:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;}
.subtabs{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 16px;cursor:pointer;white-space:nowrap;font-weight:500;}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.stat-box{background:#f8f9fa;border:1px solid var(--line);padding:16px;border-radius:8px;}
.stat-box small{display:block;color:var(--muted);margin-bottom:4px;}
.stat-box b{font-size:24px;font-family:var(--f-disp);}
.dynamic-row{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:center;margin-bottom:8px;}
.perm-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;background:#f8f9fa;padding:12px;border-radius:8px;}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast" hidden></div>

<script>
const LS_REGISTRY = 'pos-registry', LS_CURRENT = 'pos-current-pin';
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => '$' + Math.round(n).toLocaleString('en-US');
const hm = t => new Date(t).toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit', hour12: false });

let registry = {}; try { registry = JSON.parse(localStorage.getItem(LS_REGISTRY)) || {}; } catch(e) {}
if (Object.keys(registry).length === 0) registry['1234'] = '得盛咖哩';
let currentPin = localStorage.getItem(LS_CURRENT) || Object.keys(registry)[0];
let S = null; let isSysAdmin = false;

function seed(storeName) {
  return {
    storeName: storeName || '得盛咖哩', 
    groups: { size: { label: '尺寸', req: true, multi: false, ch: [['中杯', 0], ['大杯', 10]] } }, 
    menu: [ { id: 'm1', cat: '主食', name: '得盛招牌咖哩', price: 120, desc: '香濃日式咖哩', opts: [], out: false, isCombo: false, times: 'all' } ], 
    orders: [], tables: {}, nextNo: 102,
    settings: { open: true, hours: '10:30 – 21:00', managerPin: '8888', autoAcceptO2O: false },
    staff: [{ name: '店長', role: 'admin', perms:['all'] }, { name: '店員', role: 'staff', perms:['checkout'] }],
    log: []
  };
}

function loadStore(pin) {
  try { const r = localStorage.getItem('pos-data-' + pin); if (r) return JSON.parse(r); } catch(e) {} 
  return seed(registry[pin]);
}

S = loadStore(currentPin);
const ui = { locked: true, tab: 'admin', atab: 'report', inputPin: '', editMenu: null, editGroup: null, newStaff: {name:'', role:'staff', perms:[]} };
const cur = () => S.staff[ui.op] || S.staff[0];
const can = p => cur().role === 'admin' || (cur().perms && cur().perms.includes(p));

function saveStore() { localStorage.setItem('pos-data-' + currentPin, JSON.stringify(S)); }
function toast(msg) { $('#toast').textContent = msg; $('#toast').hidden = false; setTimeout(() => { $('#toast').hidden = true; }, 2600); }

function shell() {
  if (ui.locked) {
    return `<div style="display:grid;place-items:center;min-height:80vh;"><div class="card" style="text-align:center;width:min(320px,100%)">
      <h2>🔒 系統登入</h2><input type="password" class="inp" style="text-align:center;font-size:24px;margin:12px 0;" data-bind="inputPin" value="${esc(ui.inputPin)}">
      <button class="btn pri" style="width:100%" data-act="submitPin">進入系統</button></div></div>`;
  }
  
  const tabs = [
    ['report', '營運報表'], ['menu', '商品與菜單'], ['order_set', '點餐設定'], 
    ['staff', '員工權限'], ['o2o', 'O2O串接'], ['log', '開關帳紀錄']
  ];
  
  let b = '';
  if (ui.atab === 'report') b = aReport();
  else if (ui.atab === 'menu') b = aMenu();
  else if (ui.atab === 'staff') b = aStaff();
  else if (ui.atab === 'o2o') b = aO2O();
  else if (ui.atab === 'log') b = aLog();
  else b = `<div class="card"><p class="muted">模組開發中...</p></div>`;

  return `<div class="wrap"><header class="top"><div class="brand"><span class="mark">商</span><div><b>${esc(S.storeName)}</b></div></div>
    <div class="top-r"><button class="btn sm danger" data-act="lockAdmin">登出</button></div></header>
    <main><div class="subtabs" style="margin-bottom:10px;">${tabs.map(t => `<button class="chip ${ui.atab === t[0] ? 'on' : ''}" data-act="atab" data-v="${t[0]}">${t[1]}</button>`).join('')}</div>
    ${b}</main></div>${modalHtml()}`;
}

/* ================= 營運報表 (月報表/每日業績/商品分析/交易明細) ================= */
function aReport() {
  // 模擬數據聚合
  const ok = S.orders.filter(o => o.status !== 'cancelled');
  const voided = S.orders.filter(o => o.status === 'cancelled').reduce((a,o)=>a+o.total, 0);
  const rev = ok.reduce((a,o)=>a+o.total, 0);
  const cash = ok.filter(o=>o.pay.m==='cash').reduce((a,o)=>a+o.total, 0);
  const card = ok.filter(o=>o.pay.m==='card').reduce((a,o)=>a+o.total, 0);
  const dineIn = ok.filter(o=>o.type==='dine').reduce((a,o)=>a+o.total, 0);
  const takeout = ok.filter(o=>o.type==='take').reduce((a,o)=>a+o.total, 0);
  
  // 渲染 Chart.js 用的腳本會放在 render 後執行
  setTimeout(renderChart, 100);

  return `
  <div class="card">
    <div class="row sp" style="margin-bottom:16px;">
      <h2>📊 每日業績與月報表</h2>
      <div class="row"><input type="date" class="inp" style="width:auto;"><button class="btn pri" onclick="alert('報表下載中...')">📥 下載報表 (CSV/PDF)</button></div>
    </div>
    
    <div class="grid4">
      <div class="stat-box"><small>總營業額</small><b style="color:var(--ok)">${money(rev)}</b></div>
      <div class="stat-box"><small>現金收入</small><b>${money(cash)}</b></div>
      <div class="stat-box"><small>信用卡/線上支付</small><b>${money(card)}</b></div>
      <div class="stat-box"><small>當日作廢金額</small><b style="color:var(--bad)">${money(voided)}</b></div>
    </div>
    <div class="grid4" style="margin-top:12px;">
      <div class="stat-box"><small>內用金額</small><b>${money(dineIn)}</b></div>
      <div class="stat-box"><small>現場外帶</small><b>${money(takeout)}</b></div>
      <div class="stat-box"><small>外送/線上點餐</small><b>$0</b></div>
      <div class="stat-box"><small>總來客數/單數</small><b>${ok.length}</b></div>
    </div>

    <div class="grid2" style="margin-top:20px;">
      <div>
        <h3 style="margin-bottom:10px;">商品分析與熱銷佔比</h3>
        <canvas id="salesChart" style="max-height:250px;"></canvas>
      </div>
      <div style="overflow:auto; max-height:280px;">
        <h3 style="margin-bottom:10px;">每筆交易紀錄明細</h3>
        <table style="font-size:12px;">
          <thead><tr><th>時間</th><th>單號</th><th>明細</th><th>金額</th><th>付款</th></tr></thead>
          <tbody>
            ${ok.map(o => `<tr><td>${hm(o.t)}</td><td>#${o.no}</td><td>${o.lines.map(l=>l.name).join(', ')}</td><td class="num">${money(o.total)}</td><td>${o.pay.m}</td></tr>`).join('')}
            ${ok.length===0?'<tr><td colspan="5" style="text-align:center;">尚無交易紀錄</td></tr>':''}
          </tbody>
        </table>
      </div>
    </div>
  </div>`;
}

function renderChart() {
  const ctx = document.getElementById('salesChart');
  if(!ctx) return;
  // 計算商品銷量
  const itemCounts = {};
  S.orders.filter(o=>o.status!=='cancelled').forEach(o => {
    o.lines.forEach(l => { itemCounts[l.name] = (itemCounts[l.name] || 0) + l.qty; });
  });
  const labels = Object.keys(itemCounts);
  const data = Object.values(itemCounts);
  
  if(window.myPieChart) window.myPieChart.destroy();
  window.myPieChart = new Chart(ctx, {
    type: 'pie',
    data: {
      labels: labels.length ? labels : ['無數據'],
      datasets: [{ data: data.length ? data : [1], backgroundColor: ['#f39c12', '#e74c3c', '#3498db', '#2ecc71', '#9b59b6'] }]
    },
    options: { responsive: true, maintainAspectRatio: false }
  });
}

/* ================= 員工權限自訂勾選 ================= */
function aStaff() {
  const perms = [
    {id: 'checkout', label: '收銀與結帳'}, {id: 'refund', label: '作廢與退款'}, 
    {id: 'menu_edit', label: '菜單編輯'}, {id: 'report', label: '查看營運報表'}, 
    {id: 'settings', label: '系統與門市設定'}
  ];
  
  return `<div class="card scroll"><h2>員工與權限管理</h2>
    <table style="margin-top:12px;"><thead><tr><th>姓名</th><th>角色</th><th>擁有的權限</th><th>操作</th></tr></thead><tbody>
    ${S.staff.map((s, i) => `<tr><td><b>${esc(s.name)}</b></td><td>${s.role==='admin'?'店長':'店員'}</td>
    <td class="muted">${s.role==='admin'?'最高權限 (全部)':s.perms.map(p=>perms.find(x=>x.id===p)?.label).join('、')}</td>
    <td>${s.role!=='admin'?`<button class="btn sm danger" data-act="delStaff" data-i="${i}">刪除</button>`:''}</td></tr>`).join('')}
    </tbody></table>
    
    <div style="margin-top:20px; padding-top:16px; border-top:1px dashed var(--line)">
      <h3 style="margin-bottom:12px;">＋ 新增員工帳號</h3>
      <div class="grid2">
        <label class="f">員工姓名<input id="ns-name" class="inp" placeholder="例如：王小明"></label>
        <label class="f">角色類型<select id="ns-role" class="inp"><option value="staff">一般店員</option><option value="admin">店長 (擁有所有權限)</option></select></label>
      </div>
      <label class="f" style="margin-top:12px;">自訂操作權限 (店員適用)</label>
      <div class="perm-grid">
        ${perms.map(p => `<label style="cursor:pointer;"><input type="checkbox" value="${p.id}" class="ns-perm"> ${p.label}</label>`).join('')}
      </div>
      <button class="btn pri" style="margin-top:14px;" data-act="addStaff">建立員工</button>
    </div>
  </div>`;
}

/* ================= 菜單(單點/套餐)、動態規格選項 ================= */
function aMenu() {
  let h = `<div class="row sp"><h2>商品與客製化管理</h2><button class="btn pri" data-act="openMenuEdit">＋ 新增餐點/套餐</button></div>`;
  h += `<div class="card scroll" style="margin-top:14px;"><table><thead><tr><th>類型</th><th>品名</th><th>分類</th><th class="num">單價</th><th>操作</th></tr></thead><tbody>
    ${S.menu.map(m => `<tr><td>${m.isCombo?'<span class="pill info">套餐</span>':'<span class="pill">單點</span>'}</td>
    <td><b>${esc(m.name)}</b></td><td>${esc(m.cat)}</td><td class="num">${money(m.price)}</td>
    <td><button class="btn sm" data-act="openMenuEdit" data-id="${m.id}">編輯</button></td></tr>`).join('')}</tbody></table></div>`;
  
  h += `<div class="row sp" style="margin-top:24px;"><h2>客製化規格設定庫</h2><button class="btn pri" data-act="openGroupEdit">＋ 新增規格 (自動增加欄位)</button></div>
    <div class="card scroll" style="margin-top:14px;"><table><thead><tr><th>規格名稱</th><th>選項與加價明細</th><th>操作</th></tr></thead><tbody>
    ${Object.keys(S.groups).map(gKey => {
      const G = S.groups[gKey]; const chStr = G.ch.map(c => `${c[0]}(+${c[1]})`).join('、');
      return `<tr><td><b>${esc(G.label)}</b></td><td class="muted">${esc(chStr)}</td>
      <td><button class="btn sm" data-act="openGroupEdit" data-id="${gKey}">編輯</button> <button class="btn sm danger" data-act="delGroup" data-id="${gKey}">刪除</button></td></tr>`;
    }).join('')}</tbody></table></div>`;
  return h;
}

function aO2O() {
  const s = S.settings;
  return `<div class="card"><h2>O2O 與外送平台串接</h2>
    <p class="muted" style="margin-bottom:14px;">串接 UberEats 與 Foodpanda 需由系統商配發 Webhook API Key 綁定至您的外送商家後台。完成後開啟下方自動接單，訂單將直接印出並進入製作排程。</p>
    <label class="row card" style="cursor:pointer; background:#f8f9fa;">
      <input type="checkbox" style="width:20px;height:20px;" data-bind="S.settings.autoAcceptO2O" data-save ${s.autoAcceptO2O?'checked':''}> 
      <b>開啟全自動接單 (外送訂單進件後自動轉為「製作中」)</b>
    </label>
    <div class="grid2" style="margin-top:16px;">
      <div class="card" style="text-align:center;"><h3>Uber Eats</h3><br><button class="btn sm pri" onclick="alert('請聯繫客服索取 API Token')">進行綁定</button></div>
      <div class="card" style="text-align:center;"><h3>Foodpanda</h3><br><button class="btn sm pri" onclick="alert('請聯繫客服索取 API Token')">進行綁定</button></div>
    </div>
  </div>`;
}

function aLog() {
  return `<div class="card scroll"><h2>開關帳紀錄</h2>
    <table style="font-size:13px;"><thead><tr><th>營業日</th><th>時間</th><th>人員</th><th class="num">營業額</th><th class="num">現金</th><th class="num">信用卡</th><th class="num">作廢</th><th class="num">短溢</th></tr></thead><tbody>
    <tr><td>2026-10-21</td><td>09:00 開帳</td><td>店長</td><td class="num">-</td><td class="num">$5,000(預留)</td><td class="num">-</td><td class="num">-</td><td class="num">-</td></tr>
    </tbody></table></div>`;
}

function modalHtml() {
  if (!ui.modal) return '';
  
  // 1. 動態客製化規格編輯 (滿足自動新增欄位的需求)
  if (ui.modal.type === 'editGroup') {
    const d = ui.editGroup;
    return `<div class="modal" data-act="mclose"><div class="mp" data-stop><h2>${d.id?'編輯':'新增'}規格選項</h2>
      <label class="f">規格名稱 (如：甜度、加料)<input class="inp" id="eg-name" value="${esc(d.label)}"></label>
      <div class="grid2">
        <label class="f">必選/可選<select id="eg-req" class="inp"><option value="true" ${d.req?'selected':''}>必填 (一定要選)</option><option value="false" ${!d.req?'selected':''}>選填</option></select></label>
        <label class="f">單選/複選<select id="eg-multi" class="inp"><option value="false" ${!d.multi?'selected':''}>單選</option><option value="true" ${d.multi?'selected':''}>複選 (可選多個)</option></select></label>
      </div>
      <div style="background:#f8f9fa; padding:12px; border-radius:8px;">
        <label class="f" style="margin-bottom:8px;">選項與加價設定 (輸入名稱會自動產生下一行)</label>
        <div id="eg-rows">
          ${d.ch.map((c, i) => `<div class="dynamic-row"><input class="inp sm eg-cname" placeholder="選項名稱" value="${esc(c[0])}" oninput="checkDynamicRow()"><input type="number" class="inp sm eg-cprice" placeholder="加價金額" value="${c[1]}"><button class="btn sm danger" onclick="this.parentElement.remove()">X</button></div>`).join('')}
          <div class="dynamic-row"><input class="inp sm eg-cname" placeholder="選項名稱" oninput="checkDynamicRow()"><input type="number" class="inp sm eg-cprice" placeholder="加價金額"></div>
        </div>
      </div>
      <div class="row"><button class="btn pri" data-act="saveGroup">儲存規格</button><button class="btn" data-act="mclose">取消</button></div>
    </div></div>`;
  }

  // 2. 菜單編輯 (包含單點/套餐切換、營業時段)
  if (ui.modal.type === 'editMenu') {
    const d = ui.editMenu; const cats = [...new Set(S.menu.map(m => m.cat))];
    return `<div class="modal" data-act="mclose"><div class="mp" data-stop><h2>${d.id?'編輯':'新增'}餐點</h2>
      <div class="grid2">
        <label class="f">商品類型<select id="em-type" class="inp"><option value="single" ${!d.isCombo?'selected':''}>單點餐點</option><option value="combo" ${d.isCombo?'selected':''}>套餐 (含固定/任選商品)</option></select></label>
        <label class="f">供應時段 (不同時段不同菜單)<select id="em-times" class="inp"><option value="all" ${d.times==='all'?'selected':''}>全天供應</option><option value="morning" ${d.times==='morning'?'selected':''}>僅早餐 (06:00-10:30)</option><option value="lunch" ${d.times==='lunch'?'selected':''}>僅午晚餐 (10:30後)</option></select></label>
      </div>
      <div class="grid2">
        <label class="f">品名<input id="em-name" class="inp" value="${esc(d.name)}"></label>
        <label class="f">分類<input id="em-cat" class="inp" list="cats" value="${esc(d.cat)}"><datalist id="cats">${cats.map(c=>`<option value="${esc(c)}">`).join('')}</datalist></label>
      </div>
      <label class="f">單價<input id="em-price" type="number" class="inp" value="${d.price}"></label>
      <div class="f"><b>綁定客製化規格</b><div class="chips">
        ${Object.keys(S.groups).map(g => `<button class="chip ${d.opts.includes(g)?'on':''}" onclick="this.classList.toggle('on');">${esc(S.groups[g].label)}<input type="hidden" class="em-opt" value="${g}" ${d.opts.includes(g)?'data-on="1"':''}></button>`).join('')}
      </div></div>
      <div class="row"><button class="btn pri" data-act="saveMenu">儲存餐點</button><button class="btn" data-act="mclose">取消</button></div>
    </div></div>`;
  }
  return '';
}

// 輔助動態產生行數的邏輯 (綁定在 input oninput 屬性)
window.checkDynamicRow = function() {
  const rows = document.querySelectorAll('.eg-cname');
  const lastRow = rows[rows.length - 1];
  if(lastRow && lastRow.value.trim() !== '') {
    const container = document.getElementById('eg-rows');
    container.insertAdjacentHTML('beforeend', `<div class="dynamic-row"><input class="inp sm eg-cname" placeholder="選項名稱" oninput="checkDynamicRow()"><input type="number" class="inp sm eg-cprice" placeholder="加價金額"><button class="btn sm danger" onclick="this.parentElement.remove()">X</button></div>`);
  }
};

const H = {
  submitPin: () => {
    const p = ui.inputPin.trim();
    if (registry[p]) { currentPin = p; S = loadStore(currentPin); ui.locked = false; ui.inputPin = ''; toast('登入成功'); }
    else toast('密碼錯誤，測試請輸入 1234');
  },
  lockAdmin: () => { ui.locked = true; toast('已登出'); },
  atab: el => { ui.atab = el.dataset.v; }, mclose: () => { ui.modal = null; },
  
  // 員工權限儲存邏輯
  addStaff: () => {
    const name = $('#ns-name').value.trim(); const role = $('#ns-role').value;
    if(!name) return toast('請輸入姓名');
    const perms = Array.from(document.querySelectorAll('.ns-perm:checked')).map(cb => cb.value);
    S.staff.push({ name, role, perms: role==='admin'?['all']:perms });
    saveStore(); toast('建立成功'); $('#ns-name').value = '';
  },
  delStaff: el => { S.staff.splice(Number(el.dataset.i), 1); saveStore(); toast('已刪除'); },

  // 規格與菜單邏輯
  openGroupEdit: el => {
    const id = el.dataset.id;
    if(id) ui.editGroup = { id, ...S.groups[id] };
    else ui.editGroup = { id: '', label: '', req: false, multi: false, ch: [] };
    ui.modal = { type: 'editGroup' };
  },
  saveGroup: () => {
    const label = $('#eg-name').value.trim(); if(!label) return toast('請填寫規格名稱');
    const ch = []; 
    document.querySelectorAll('.dynamic-row').forEach(row => {
      const name = row.querySelector('.eg-cname').value.trim();
      const price = Number(row.querySelector('.eg-cprice').value) || 0;
      if(name) ch.push([name, price]);
    });
    if(!ch.length) return toast('請至少填寫一個選項');
    const id = ui.editGroup.id || 'g_' + Date.now();
    S.groups[id] = { label, req: $('#eg-req').value==='true', multi: $('#eg-multi').value==='true', ch };
    saveStore(); ui.modal = null; toast('規格已儲存');
  },
  delGroup: el => { delete S.groups[el.dataset.id]; saveStore(); toast('已刪除'); },
  
  openMenuEdit: el => {
    const id = el.dataset.id;
    if(id) ui.editMenu = { ...S.menu.find(m=>m.id===id) };
    else ui.editMenu = { id: '', name: '', cat: '主食', price: 0, desc: '', opts: [], isCombo: false, times: 'all' };
    ui.modal = { type: 'editMenu' };
  },
  saveMenu: () => {
    const name = $('#em-name').value.trim(); if(!name) return toast('請填寫品名');
    const opts = Array.from(document.querySelectorAll('.em-opt')).filter(x=>x.parentElement.classList.contains('on')).map(x=>x.value);
    const mData = {
      id: ui.editMenu.id || 'm'+Date.now(), name, cat: $('#em-cat').value.trim(), price: Number($('#em-price').value)||0,
      isCombo: $('#em-type').value === 'combo', times: $('#em-times').value, opts, out: false, img: ''
    };
    if(ui.editMenu.id) { const idx = S.menu.findIndex(x=>x.id===mData.id); S.menu[idx] = mData; }
    else S.menu.push(mData);
    saveStore(); ui.modal = null; toast('菜單已更新');
  }
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  if (el.classList.contains('modal') && e.target.closest('[data-stop]')) return;
  if (H[el.dataset.act]) { H[el.dataset.act](el); render(); }
});

const val = t => t.type === 'checkbox' ? t.checked : t.dataset.num !== undefined ? Number(t.value) : t.value;
document.addEventListener('input', e => { if (e.target.dataset.bind) { const parts = e.target.dataset.bind.split('.'); let root = window; parts.slice(0,-1).forEach(p=>root=root[p]); root[parts[parts.length-1]] = val(e.target); }});

function render() {
  const sy = window.scrollY; $('#app').innerHTML = shell(); window.scrollTo(0, sy);
}
render();
</script>
</body>
</html>
